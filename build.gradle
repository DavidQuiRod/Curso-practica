/*
 * This file was generated by the Gradle 'init' task.
 */

plugins {
    id 'java-library'
    id 'maven-publish'
}

repositories {
    mavenLocal()
    maven {
        url = uri('https://repo.maven.apache.org/maven2/')
    }
}

dependencies {
    api libs.org.seleniumhq.selenium.selenium.java
    api libs.io.github.bonigarcia.webdrivermanager
    testImplementation libs.org.testng.testng
    testImplementation libs.io.cucumber.cucumber.java
    testImplementation libs.io.cucumber.cucumber.testng
    testImplementation libs.io.cucumber.cucumber.picocontainer
    implementation 'org.apache.poi:poi:5.2.3'
    implementation 'org.apache.poi:poi-ooxml:5.2.3'
    implementation 'org.apache.logging.log4j:log4j-core:2.24.1' // Match your log4j-api version
}

group = 'liverpool'
version = '1.0-SNAPSHOT'
description = 'liverpool-automation'
java.sourceCompatibility = JavaVersion.VERSION_11

publishing {
    publications {
        maven(MavenPublication) {
            from(components.java)
        }
    }
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

tasks.withType(Javadoc) {
    options.encoding = 'UTF-8'
}

tasks.named('test') {
    useTestNG()
}
